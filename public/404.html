<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 — Area Not Found · MANISH.DEV</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      color: #f2f5f7;
      font-family: "Space Mono", monospace;
      background:
        radial-gradient(circle at center, rgba(140,255,59,.08), transparent 40%),
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px),
        #07090c;
      background-size: auto, 38px 38px, 38px 38px, auto;
    }
    .eyebrow { color: #8cff3b; font-size: 12px; letter-spacing: 3px; }
    h1 { margin: 14px 0 10px; font: 800 clamp(64px, 18vw, 140px)/1 Inter, sans-serif; letter-spacing: -4px; }
    h2 { font-size: 18px; letter-spacing: 3px; }
    p { margin: 18px auto 32px; max-width: 420px; color: #7d8793; font-size: 13px; line-height: 1.7; }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 20px;
      border-radius: 7px;
      background: #8cff3b;
      color: #071006;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      text-decoration: none;
    }
    a:focus-visible { outline: 2px solid #8cff3b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">ERROR / SECTOR UNKNOWN</div>
    <h1>404</h1>
    <h2>AREA NOT FOUND</h2>
    <p>This part of the map hasn't been unlocked yet. Head back to base and pick another quest.</p>
    <a href="/">← RETURN TO BASE</a>
  </main>
</body>
</html>
